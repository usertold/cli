name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify signed release tag and main head
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be v<stable-semver>" >&2
            exit 1
          }
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag

          TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          test "$(jq -r '.object.type' <<<"$TAG_REF")" = tag
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<<"$TAG_REF")"
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          test "$(jq -r '.verification.verified' <<<"$TAG_OBJECT")" = true

          TAG_COMMIT_SHA="$(jq -r '.object.sha' <<<"$TAG_OBJECT")"
          test "$(jq -r '.object.type' <<<"$TAG_OBJECT")" = commit
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$TAG_COMMIT_SHA" = "$(git rev-parse HEAD)"
          test "$TAG_COMMIT_SHA" = "$(git rev-parse origin/main)"
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$(npm view usertold@$PACKAGE_VERSION version 2>/dev/null || true)" = ""
      - run: npm run check
      - name: Pack the reviewed release artifact
        id: pack
        run: |
          mkdir release
          PACK_RESULT="$(npm pack --json --ignore-scripts --pack-destination release)"
          TARBALL="$(node -e 'const fs = require("node:fs"); const [result] = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(result.filename)' <<<"$PACK_RESULT")"
          test -n "$TARBALL"
          test -f "release/$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "release/$TARBALL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usertold-release-package
          path: release/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usertold-release-package
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm supports trusted staged publishing
        run: |
          NPM_VERSION="$(npm --version)"
          export NPM_VERSION
          node -e 'const [major, minor] = process.env.NPM_VERSION.split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)'
      - name: Stage package for human 2FA approval
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          test -f "release/$TARBALL"
          npm stage publish "release/$TARBALL"
