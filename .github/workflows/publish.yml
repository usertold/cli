name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Release workflow run containing the verified build artifact
        required: true
        type: string
      source_sha:
        description: Exact signed release commit produced by the source run
        required: true
        type: string
      package_version:
        description: Stable package version to recover
        required: true
        type: string
      sha256:
        description: SHA-256 printed by the source build job
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify signed release tag and main head
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be v<stable-semver>" >&2
            exit 1
          }
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag

          TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          test "$(jq -r '.object.type' <<<"$TAG_REF")" = tag
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<<"$TAG_REF")"
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          test "$(jq -r '.verification.verified' <<<"$TAG_OBJECT")" = true

          TAG_COMMIT_SHA="$(jq -r '.object.sha' <<<"$TAG_OBJECT")"
          test "$(jq -r '.object.type' <<<"$TAG_OBJECT")" = commit
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$TAG_COMMIT_SHA" = "$(git rev-parse HEAD)"
          test "$TAG_COMMIT_SHA" = "$(git rev-parse origin/main)"
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$(npm view usertold@$PACKAGE_VERSION version 2>/dev/null || true)" = ""
      - run: npm run check
      - name: Pack the reviewed release artifact
        id: pack
        run: |
          mkdir release
          PACK_RESULT="$(npm pack --json --ignore-scripts --pack-destination release)"
          TARBALL="$(node -e 'const fs = require("node:fs"); const [result] = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(result.filename)' <<<"$PACK_RESULT")"
          test -n "$TARBALL"
          test -f "release/$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "release/$TARBALL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usertold-release-package
          path: release/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usertold-release-package
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm supports trusted staged publishing
        run: |
          NPM_VERSION="$(npm --version)"
          export NPM_VERSION
          node -e 'const [major, minor] = process.env.NPM_VERSION.split(".").map(Number); if (major < 11 || (major === 11 && minor < 15)) process.exit(1)'
      - name: Stage package for human 2FA approval
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          test -f "release/$TARBALL"
          npm stage publish "./release/$TARBALL"

  recover-stage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usertold-release-package
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify source run and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]

          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r '.event' <<<"$RUN")" = release
          test "$(jq -r '.head_sha' <<<"$RUN")" = "$SOURCE_SHA"

          JOBS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          test "$(jq -s '[.[].jobs[] | select(.name == "build" and .conclusion == "success")] | length' <<<"$JOBS")" = 1

          TARBALL="usertold-$PACKAGE_VERSION.tgz"
          test -f "release/$TARBALL"
          test "$(find release -maxdepth 1 -type f | wc -l)" = 1
          printf '%s  %s\n' "$EXPECTED_SHA256" "release/$TARBALL" | sha256sum --check --strict -

          PACKAGE_JSON="$(tar -xOzf "release/$TARBALL" package/package.json)"
          test "$(jq -r '.name' <<<"$PACKAGE_JSON")" = usertold
          test "$(jq -r '.version' <<<"$PACKAGE_JSON")" = "$PACKAGE_VERSION"
          test "$(jq -r '.repository.url' <<<"$PACKAGE_JSON")" = git+https://github.com/usertold/cli.git
          test "$(npm view "usertold@$PACKAGE_VERSION" version 2>/dev/null || true)" = ""
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
      - name: Recover npm stage with trusted publishing
        run: npm stage publish "./release/$TARBALL"
